<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Reasignaciones', ~{::section})}">
<section class="panel">
    <div class="panel-intro">
        <h3 th:text="${rolActivo == 'coordinador' ? 'Gestión de cobertura y reemplazos' : 'Solicitudes de reasignación'}">Reasignaciones</h3>
        <p th:text="${rolActivo == 'coordinador' ? 'Visualiza quién pidió apoyo, el reemplazo propuesto y el estado de respuesta del turno.' : 'Consulta tus solicitudes y el avance de cada propuesta de reemplazo.'}">Panel de reasignaciones.</p>
    </div>
    <div class="table-toolbar">
        <p class="muted" th:text="${rolActivo == 'coordinador' ? 'Gestión operativa de reasignaciones.' : 'Solicitudes de reasignación por impedimento.'}">Reasignaciones</p>
        <a class="primary-button" th:if="${permisos.allows('reasignaciones', 'create')}" th:href="@{/reasignaciones/nuevo}">Nueva reasignación</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Turno</th>
            <th>Solicitante</th>
            <th>Reemplazo</th>
            <th>Estado</th>
            <th th:if="${permisos.showsActions('reasignaciones')}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${reasignaciones}">
            <td>
                <div class="table-main">
                    <strong th:text="${item.turno.franja}"></strong>
                    <small th:text="${item.turno.zona.nombre}"></small>
                </div>
            </td>
            <td>
                <div class="table-main">
                    <strong th:text="${item.docenteSolicitante.nombre}"></strong>
                    <small th:text="${#temporals.format(item.propuestaEn, 'dd/MM/yyyy HH:mm')}"></small>
                </div>
            </td>
            <td>
                <div class="table-main">
                    <strong th:text="${item.docenteReemplazo != null ? item.docenteReemplazo.nombre : 'Pendiente'}"></strong>
                    <small th:text="${item.docenteReemplazo != null ? 'Candidato asignado' : 'Esperando respuesta'}"></small>
                </div>
            </td>
            <td>
                <span class="badge"
                      th:classappend="${item.estado.name() == 'ACEPTADA' ? ' success' : (item.estado.name() == 'RECHAZADA' ? ' danger' : ' warning')}"
                      th:text="${item.estado}"></span>
            </td>
            <td class="table-actions" th:if="${permisos.showsActions('reasignaciones')}">
                <a class="secondary-button" th:if="${permisos.allows('reasignaciones', 'edit')}" th:href="@{/reasignaciones/{id}/editar(id=${item.id})}">Editar</a>
                <form method="post" th:if="${permisos.allows('reasignaciones', 'delete')}" th:action="@{/reasignaciones/{id}/eliminar(id=${item.id})}">
                    <button class="danger-button">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</html>
