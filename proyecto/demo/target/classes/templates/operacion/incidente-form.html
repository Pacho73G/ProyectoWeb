<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(${titulo}, ~{::section})}"><section class="form-card"><form class="form-grid" method="post" th:action="@{${accion}}" th:object="${form}"><div class="field"><label>Turno</label><select th:field="*{turnoId}" required><option value="">Selecciona un turno</option><option th:each="item : ${turnos}" th:value="${item.id}" th:text="${item.franja}"></option></select></div><div class="field"><label>Docente</label><select th:field="*{docenteId}" required><option value="">Selecciona un docente</option><option th:each="item : ${docentes}" th:value="${item.id}" th:text="${item.nombre}"></option></select></div><div class="field"><label>Zona</label><select th:field="*{zonaId}" required><option value="">Selecciona una zona</option><option th:each="item : ${zonas}" th:value="${item.id}" th:text="${item.nombre}"></option></select></div><div class="field"><label>Tipo</label><select th:field="*{tipo}" required><option value="">Selecciona un tipo</option><option th:each="item : ${tiposIncidente}" th:value="${item}" th:text="${item}"></option></select></div><div class="field"><label>Severidad</label><select th:field="*{severidad}" required><option value="">Selecciona una severidad</option><option th:each="item : ${severidadesIncidente}" th:value="${item}" th:text="${item}"></option></select></div><div class="field"><label>Registrado en</label><input type="datetime-local" th:field="*{registradoEn}" required></div><div class="field full"><label>Descripción</label><textarea th:field="*{descripcion}"></textarea></div><div class="field full"><label>Observación social</label><textarea th:field="*{observacionSocial}"></textarea></div><label class="checkbox"><input type="checkbox" th:field="*{requiereSeguimiento}">Requiere seguimiento</label><div class="form-actions full"><a class="secondary-button" th:href="@{/incidentes}">Cancelar</a><button class="primary-button">Guardar</button></div></form></section></html>
