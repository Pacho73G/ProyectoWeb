<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(${titulo}, ~{::section})}"><section class="form-card"><form class="form-grid" method="post" th:action="@{${accion}}" th:object="${form}"><div class="field"><label>Turno</label><select th:field="*{turnoId}" required><option value="">Selecciona un turno</option><option th:each="item : ${turnos}" th:value="${item.id}" th:text="${item.franja} + ' · ' + ${item.fecha}"></option></select></div><div class="field"><label>Docente</label><select th:field="*{docenteId}" required><option value="">Selecciona un docente</option><option th:each="item : ${docentes}" th:value="${item.id}" th:text="${item.nombre}"></option></select></div><div class="field"><label>Zona</label><select th:field="*{zonaId}" required><option value="">Selecciona una zona</option><option th:each="item : ${zonas}" th:value="${item.id}" th:text="${item.nombre}"></option></select></div><div class="field"><label>Método</label><select th:field="*{metodo}" required><option value="">Selecciona un método</option><option th:each="item : ${metodosCheckIn}" th:value="${item}" th:text="${item}"></option></select><small class="muted">Usa QR o PIN según el acceso disponible en la zona.</small></div><div class="field full"><label>Evidencia</label><input th:field="*{evidencia}"></div><div class="field"><label>Fecha y hora</label><input type="datetime-local" th:field="*{timestamp}" required></div><label class="checkbox"><input type="checkbox" th:field="*{valido}">Válido</label><div class="form-actions full"><a class="secondary-button" th:href="@{/checkins}">Cancelar</a><button class="primary-button">Guardar</button></div></form></section></html>
