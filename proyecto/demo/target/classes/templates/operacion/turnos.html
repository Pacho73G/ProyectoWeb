<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Turnos', ~{::section})}">
<section class="panel">
    <div class="panel-intro">
        <h3 th:text="${rolActivo == 'administrador' ? 'Programación de turnos' : 'Calendario operativo de turnos'}">Programación de turnos</h3>
        <p th:text="${rolActivo == 'administrador' ? 'Crea franjas personalizadas, asigna docente y zona, y deja visible el estado operativo de cada cobertura.' : 'Consulta la franja, la zona asignada y el estado actual de cada turno en una sola vista.'}">Resumen operativo de turnos.</p>
    </div>
    <div class="table-toolbar">
        <p class="muted" th:text="${rolActivo == 'administrador' ? 'Asignación y carga de turnos. Puedes crear nuevas franjas personalizadas.' : 'Calendario de turnos asignados y franjas programadas.'}">Turnos</p>
        <a class="primary-button" th:if="${permisos.allows('turnos', 'create')}" th:href="@{/turnos/nuevo}">Nuevo turno</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Docente</th>
            <th>Zona</th>
            <th>Fecha</th>
            <th>Franja</th>
            <th>Estado</th>
            <th th:if="${permisos.showsActions('turnos')}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${turnos}">
            <td>
                <div class="table-main">
                    <strong th:text="${item.docente.nombre}"></strong>
                    <small th:text="${item.docente.email}"></small>
                </div>
            </td>
            <td>
                <div class="table-main">
                    <strong th:text="${item.zona.nombre}"></strong>
                    <small th:text="${item.zona.ubicacion}"></small>
                </div>
            </td>
            <td th:text="${item.fecha}"></td>
            <td>
                <div class="table-main">
                    <strong th:text="${item.franja}"></strong>
                    <small th:text="${item.horaInicio + ' - ' + item.horaFin}"></small>
                </div>
            </td>
            <td>
                <span class="badge"
                      th:classappend="${item.estado.name() == 'EN_CURSO' ? ' success' : (item.estado.name() == 'SIN_COBERTURA' ? ' danger' : (item.estado.name() == 'PENDIENTE' ? ' warning' : ' info'))}"
                      th:text="${item.estado}"></span>
            </td>
            <td class="table-actions" th:if="${permisos.showsActions('turnos')}">
                <a class="secondary-button" th:if="${permisos.allows('turnos', 'edit')}" th:href="@{/turnos/{id}/editar(id=${item.id})}">Editar</a>
                <form method="post" th:if="${permisos.allows('turnos', 'delete')}" th:action="@{/turnos/{id}/eliminar(id=${item.id})}">
                    <button class="danger-button">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</html>
