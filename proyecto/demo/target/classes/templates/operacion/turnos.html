<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Turnos', ~{::section})}"><section class="panel"><div class="table-toolbar"><p class="muted">CRUD de turnos y asociaciones.</p><a class="primary-button" th:href="@{/turnos/nuevo}">Nuevo turno</a></div><table><thead><tr><th>Docente</th><th>Zona</th><th>Fecha</th><th>Franja</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${turnos}"><td th:text="${item.docente.nombre}"></td><td th:text="${item.zona.nombre}"></td><td th:text="${item.fecha}"></td><td th:text="${item.franja}"></td><td th:text="${item.estado}"></td><td class="table-actions"><a class="secondary-button" th:href="@{/turnos/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/turnos/{id}/eliminar(id=${item.id})}"><button class="danger-button">Eliminar</button></form></td></tr></tbody></table></section></html>
