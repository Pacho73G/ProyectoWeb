<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Zonas', ~{::section})}">
<section class="panel">
    <div class="table-toolbar">
        <p class="muted" th:text="${rolActivo == 'administrador' ? 'Gestión de zonas del sistema.' : 'Cobertura y consulta de zonas.'}">Zonas</p>
        <a class="primary-button" th:if="${permisos.allows('zonas', 'create')}" th:href="@{/zonas/nuevo}">Nueva zona</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Ubicación</th>
            <th>Capacidad</th>
            <th>Activa</th>
            <th th:if="${permisos.showsActions('zonas')}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${zonas}">
            <td th:text="${item.nombre}"></td>
            <td th:text="${item.ubicacion}"></td>
            <td th:text="${item.capacidadMaxima}"></td>
            <td th:text="${item.activa}"></td>
            <td class="table-actions" th:if="${permisos.showsActions('zonas')}">
                <a class="secondary-button" th:if="${permisos.allows('zonas', 'edit')}" th:href="@{/zonas/{id}/editar(id=${item.id})}">Editar</a>
                <form method="post" th:if="${permisos.allows('zonas', 'delete')}" th:action="@{/zonas/{id}/eliminar(id=${item.id})}">
                    <button class="danger-button">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</html>
