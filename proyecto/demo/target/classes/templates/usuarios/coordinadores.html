<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Coordinadores', ~{::section})}"><section class="panel"><div class="table-toolbar"><p class="muted">CRUD de coordinadores.</p><a class="primary-button" th:href="@{/coordinadores/nuevo}">Nuevo coordinador</a></div><table><thead><tr><th>Nombre</th><th>Email</th><th>Nivel</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${coordinadores}"><td th:text="${item.nombre}"></td><td th:text="${item.email}"></td><td th:text="${item.nivel}"></td><td class="table-actions"><a class="secondary-button" th:href="@{/coordinadores/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/coordinadores/{id}/eliminar(id=${item.id})}"><button class="danger-button">Eliminar</button></form></td></tr></tbody></table></section></html>
