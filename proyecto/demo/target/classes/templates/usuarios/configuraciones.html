<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Configuración del sistema', ~{::section})}"><section class="panel"><div class="table-toolbar"><p class="muted">Parámetros globales administrados por un administrador.</p><a class="primary-button" th:href="@{/configuraciones/nuevo}">Nueva configuración</a></div><table><thead><tr><th>Administrador</th><th>Alerta ausencia</th><th>Ventana</th><th>Inactividad</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${configuraciones}"><td th:text="${item.administrador.nombre}"></td><td th:text="${item.minutosAlertaAusencia}"></td><td th:text="${item.segundosVentanaReasignacion}"></td><td th:text="${item.minutosInactividad}"></td><td class="table-actions"><a class="secondary-button" th:href="@{/configuraciones/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/configuraciones/{id}/eliminar(id=${item.id})}"><button class="danger-button">Eliminar</button></form></td></tr></tbody></table></section></html>
