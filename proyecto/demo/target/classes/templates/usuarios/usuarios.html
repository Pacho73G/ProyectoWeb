<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Usuarios', ~{::section})}">
<section class="panel">
    <div class="table-toolbar">
        <p class="muted">Gestión centralizada de usuarios del sistema.</p>
        <a class="primary-button" th:if="${permisos.allows('usuarios', 'create')}" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>
    <table>
        <thead>
        <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Activo</th><th th:if="${permisos.showsActions('usuarios')}">Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${usuarios}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.nombre}"></td>
            <td th:text="${item.email}"></td>
            <td th:text="${item.rol}"></td>
            <td th:text="${item.activo}"></td>
            <td class="table-actions" th:if="${permisos.showsActions('usuarios')}">
                <a class="secondary-button" th:if="${permisos.allows('usuarios', 'edit')}" th:href="@{/usuarios/{id}/editar(id=${item.id})}">Editar</a>
                <form method="post" th:if="${permisos.allows('usuarios', 'delete')}" th:action="@{/usuarios/{id}/eliminar(id=${item.id})}">
                    <button class="danger-button">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</html>
