<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(${titulo}, ~{::section})}"><section class="form-card"><form class="form-grid" method="post" th:action="@{${accion}}" th:object="${form}"><div class="field"><label>Docente</label><select th:field="*{docenteId}" required><option value="">Selecciona un docente</option><option th:each="item : ${docentes}" th:value="${item.id}" th:text="${item.nombre}"></option></select></div><div class="field"><label>Turno</label><select th:field="*{turnoId}" required><option value="">Selecciona un turno</option><option th:each="item : ${turnos}" th:value="${item.id}" th:text="${item.franja}"></option></select></div><div class="field"><label>Iniciado en</label><input type="datetime-local" th:field="*{iniciadoEn}" required></div><div class="field"><label>Finalizado en</label><input type="datetime-local" th:field="*{finalizadoEn}"></div><div class="field"><label>Estado</label><select th:field="*{estado}" required><option value="">Selecciona un estado</option><option th:each="item : ${estadosRecorrido}" th:value="${item}" th:text="${item}"></option></select></div><div class="field"><label>Duración</label><input type="number" th:field="*{duracionMinutos}" min="0" required></div><div class="form-actions full"><a class="secondary-button" th:href="@{/recorridos}">Cancelar</a><button class="primary-button">Guardar</button></div></form></section></html>
