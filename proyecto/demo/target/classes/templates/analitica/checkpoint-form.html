<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(${titulo}, ~{::section})}"><section class="form-card"><form class="form-grid" method="post" th:action="@{${accion}}" th:object="${form}"><div class="field"><label>Zona</label><select th:field="*{zonaId}" required><option value="">Selecciona una zona</option><option th:each="item : ${zonas}" th:value="${item.id}" th:text="${item.nombre}"></option></select></div><div class="field"><label>Recorrido</label><select th:field="*{recorridoId}" required><option value="">Selecciona un recorrido</option><option th:each="item : ${recorridos}" th:value="${item.id}" th:text="${item.id} + ' · ' + ${item.docente.nombre}"></option></select></div><div class="field"><label>Código QR</label><input th:field="*{codigoQR}" required></div><div class="field"><label>Orden</label><input type="number" th:field="*{orden}" min="0" required></div><div class="field full"><label>Descripción</label><textarea th:field="*{descripcion}"></textarea></div><div class="field"><label>Escaneado en</label><input type="datetime-local" th:field="*{escaneadoEn}" required></div><div class="form-actions full"><a class="secondary-button" th:href="@{/checkpoints}">Cancelar</a><button class="primary-button">Guardar</button></div></form></section></html>
