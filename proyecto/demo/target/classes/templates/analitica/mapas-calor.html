<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Mapas de calor', ~{::section})}">
<section class="panel">
    <div class="table-toolbar">
        <p class="muted">Analítica de incidentes por zona y franja.</p>
        <a class="primary-button" th:if="${permisos.allows('mapas-calor', 'create')}" th:href="@{/mapas-calor/nuevo}">Nuevo mapa</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Zona</th>
            <th>Franja</th>
            <th>Tipo</th>
            <th>Total</th>
            <th>Porcentaje</th>
            <th th:if="${permisos.showsActions('mapas-calor')}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${mapasCalor}">
            <td th:text="${item.zona.nombre}"></td>
            <td th:text="${item.franja}"></td>
            <td th:text="${item.tipoIncidente}"></td>
            <td th:text="${item.totalIncidentes}"></td>
            <td th:text="${item.porcentaje}"></td>
            <td class="table-actions" th:if="${permisos.showsActions('mapas-calor')}">
                <a class="secondary-button" th:if="${permisos.allows('mapas-calor', 'edit')}" th:href="@{/mapas-calor/{id}/editar(id=${item.id})}">Editar</a>
                <form method="post" th:if="${permisos.allows('mapas-calor', 'delete')}" th:action="@{/mapas-calor/{id}/eliminar(id=${item.id})}">
                    <button class="danger-button">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</html>
