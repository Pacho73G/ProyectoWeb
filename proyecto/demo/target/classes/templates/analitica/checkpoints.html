<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Checkpoints de recorrido', ~{::section})}"><section class="panel"><div class="table-toolbar"><p class="muted">Puntos validados por QR.</p><a class="primary-button" th:href="@{/checkpoints/nuevo}">Nuevo checkpoint</a></div><table><thead><tr><th>Zona</th><th>Recorrido</th><th>Código QR</th><th>Orden</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${checkpoints}"><td th:text="${item.zona.nombre}"></td><td th:text="${item.recorrido.id}"></td><td th:text="${item.codigoQR}"></td><td th:text="${item.orden}"></td><td class="table-actions"><a class="secondary-button" th:href="@{/checkpoints/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/checkpoints/{id}/eliminar(id=${item.id})}"><button class="danger-button">Eliminar</button></form></td></tr></tbody></table></section></html>
