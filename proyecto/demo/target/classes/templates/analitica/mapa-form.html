<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(${titulo}, ~{::section})}"><section class="form-card"><form class="form-grid" method="post" th:action="@{${accion}}" th:object="${form}"><div class="field"><label>Zona</label><select th:field="*{zonaId}" required><option value="">Selecciona una zona</option><option th:each="item : ${zonas}" th:value="${item.id}" th:text="${item.nombre}"></option></select></div><div class="field"><label>Franja</label><input th:field="*{franja}" required></div><div class="field"><label>Tipo de incidente</label><select th:field="*{tipoIncidente}" required><option value="">Selecciona un tipo</option><option th:each="item : ${tiposIncidente}" th:value="${item}" th:text="${item}"></option></select></div><div class="field"><label>Total incidentes</label><input type="number" th:field="*{totalIncidentes}" min="0" required></div><div class="field"><label>Porcentaje</label><input type="number" step="0.01" th:field="*{porcentaje}" min="0" required></div><div class="field"><label>Periodo inicio</label><input type="date" th:field="*{periodoInicio}" required></div><div class="field"><label>Periodo fin</label><input type="date" th:field="*{periodoFin}" required></div><div class="form-actions full"><a class="secondary-button" th:href="@{/mapas-calor}">Cancelar</a><button class="primary-button">Guardar</button></div></form></section></html>
