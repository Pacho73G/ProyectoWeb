<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Métricas docentes', ~{::section})}"><section class="panel"><div class="table-toolbar"><p class="muted">Gamificación y desempeño.</p><a class="primary-button" th:href="@{/metricas/nuevo}">Nueva métrica</a></div><table><thead><tr><th>Docente</th><th>Periodo</th><th>Puntualidad</th><th>Puntaje total</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${metricas}"><td th:text="${item.docente.nombre}"></td><td th:text="${item.periodo}"></td><td th:text="${item.puntualidad}"></td><td th:text="${item.puntajeTotal}"></td><td class="table-actions"><a class="secondary-button" th:href="@{/metricas/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/metricas/{id}/eliminar(id=${item.id})}"><button class="danger-button">Eliminar</button></form></td></tr></tbody></table></section></html>
