<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(${titulo}, ~{::section})}"><section class="form-card"><form class="form-grid" method="post" th:action="@{${accion}}" th:object="${form}"><div class="field full"><label>Docente</label><select th:field="*{docenteId}" required><option value="">Selecciona un docente</option><option th:each="item : ${docentes}" th:value="${item.id}" th:text="${item.nombre}"></option></select></div><div class="field"><label>Puntualidad</label><input type="number" th:field="*{puntualidad}" min="0" required></div><div class="field"><label>Cobertura</label><input type="number" th:field="*{cobertura}" min="0" required></div><div class="field"><label>Retrasos</label><input type="number" th:field="*{retrasos}" min="0" required></div><div class="field"><label>Recorridos completados</label><input type="number" th:field="*{recorridosCompletados}" min="0" required></div><div class="field"><label>Incidentes registrados</label><input type="number" th:field="*{incidentesRegistrados}" min="0" required></div><div class="field"><label>Reasignaciones aceptadas</label><input type="number" th:field="*{reasignacionesAceptadas}" min="0" required></div><div class="field"><label>Puntaje total</label><input type="number" th:field="*{puntajeTotal}" min="0" required></div><div class="field"><label>Periodo</label><input th:field="*{periodo}" required></div><div class="form-actions full"><a class="secondary-button" th:href="@{/metricas}">Cancelar</a><button class="primary-button">Guardar</button></div></form></section></html>
