<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Reconocimientos', ~{::section})}"><section class="panel"><div class="table-toolbar"><p class="muted">Reconocimientos generados desde métricas.</p><a class="primary-button" th:href="@{/reconocimientos/nuevo}">Nuevo reconocimiento</a></div><table><thead><tr><th>Título</th><th>Docente</th><th>Tipo</th><th>Trimestre</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${reconocimientos}"><td th:text="${item.titulo}"></td><td th:text="${item.metricaDocente.docente.nombre}"></td><td th:text="${item.tipo}"></td><td th:text="${item.trimestre}"></td><td class="table-actions"><a class="secondary-button" th:href="@{/reconocimientos/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/reconocimientos/{id}/eliminar(id=${item.id})}"><button class="danger-button">Eliminar</button></form></td></tr></tbody></table></section></html>
