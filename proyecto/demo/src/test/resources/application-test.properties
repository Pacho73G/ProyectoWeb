# ─────────────────────────────────────────────────────────────────────────────
# Perfil de pruebas: H2 en memoria con compatibilidad PostgreSQL.
# Hibernate genera el schema a partir de las entidades; NO se ejecuta schema.sql
# porque H2 no soporta algunos dialectos PG (BIGSERIAL, ALTER TABLE IF NOT EXISTS).
# ─────────────────────────────────────────────────────────────────────────────

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y destruye el schema con cada ejecucion de la suite
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# No ejecutar schema.sql ni data.sql en tests
spring.sql.init.mode=never

# Sin carga de datos semilla: cada test controla su propio estado
app.seed.enabled=false

# JWT identico al de produccion para que el filtro JWT funcione en tests
security.jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
security.jwt.expiration-hours=8
