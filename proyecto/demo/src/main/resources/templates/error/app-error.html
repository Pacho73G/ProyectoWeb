<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Vigilancia Docente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<section class="login-card" style="max-width: 760px;">
    <div class="hero">
        <div class="hero-icon">
            <svg viewBox="0 0 64 64" aria-hidden="true">
                <path d="M32 10 8 52h48L32 10z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                <path d="M32 24v14M32 46h.01" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
        <h1 th:text="${title}">Error del sistema</h1>
        <p th:text="${message}">Ocurrió un problema al procesar la solicitud.</p>
    </div>
    <div class="role-selector" style="text-align: center;">
        <p class="muted" th:if="${detail}" th:text="${detail}">Detalle técnico</p>
        <a class="ghost-button" th:href="@{${backUrl}}">Volver</a>
    </div>
</section>
</body>
</html>
