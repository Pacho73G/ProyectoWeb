<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(${titulo}, ~{::section})}"><section class="form-card"><form class="form-grid" method="post" th:action="@{${accion}}" th:object="${form}"><div class="field full"><label>Métrica docente</label><select th:field="*{metricaDocenteId}" required><option value="">Selecciona una métrica</option><option th:each="item : ${metricas}" th:value="${item.id}" th:text="${item.docente.nombre} + ' · ' + ${item.periodo}"></option></select></div><div class="field"><label>Título</label><input th:field="*{titulo}" required></div><div class="field"><label>Tipo</label><select th:field="*{tipo}" required><option value="">Selecciona un tipo</option><option th:each="item : ${tiposReconocimiento}" th:value="${item}" th:text="${item}"></option></select></div><div class="field"><label>Otorgado en</label><input type="date" th:field="*{otorgadoEn}" required></div><div class="field"><label>Trimestre</label><input th:field="*{trimestre}" required></div><div class="field full"><label>Descripción</label><textarea th:field="*{descripcion}"></textarea></div><div class="form-actions full"><a class="secondary-button" th:href="@{/reconocimientos}">Cancelar</a><button class="primary-button">Guardar</button></div></form></section></html>
