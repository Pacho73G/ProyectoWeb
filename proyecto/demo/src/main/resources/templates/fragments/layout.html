<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Vigilancia Docente'">Vigilancia Docente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-shell" th:classappend="${' role-' + rolUi.key}">
<aside class="sidebar" th:classappend="${' role-' + rolUi.key}">
    <div>
        <div class="sidebar-hero">
            <a class="brand" th:href="@{/dashboard}">
                <div class="brand-badge">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <path d="M14 30.5 32 18l18 12.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M20 28v20a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2V28" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M28 50V38a4 4 0 0 1 8 0v12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="32" cy="28" r="4" fill="none" stroke="currentColor" stroke-width="4"/>
                    </svg>
                </div>
                <div class="brand-copy">
                    <strong>Sistema de Vigilancia</strong>
                    <span>Colegio San José</span>
                </div>
            </a>
        </div>
        <nav class="nav-links">
            <a th:each="item : ${rolUi.navItems}"
               th:href="@{${item.href}}"
               th:classappend="${(item.href == '/dashboard' and currentPath == '/dashboard') or (item.href != '/dashboard' and #strings.startsWith(currentPath, item.href)) ? ' active' : ''}">
                <span class="nav-icon" th:switch="${item.icon}">
                    <svg th:case="'dashboard'" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l4-4 3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 7h3v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <svg th:case="'calendar'" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 3v4M16 3v4M3 10h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <svg th:case="'pin'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.4 6-11a6 6 0 1 0-12 0c0 5.6 6 11 6 11z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    <svg th:case="'checkin'" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 12.5 11 15l5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <svg th:case="'alert'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 3 20h18L12 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v4M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <svg th:case="'refresh'" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 9A7 7 0 0 1 18 6M17.5 15A7 7 0 0 1 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <svg th:case="'route'" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 6h4a3 3 0 0 1 0 6h-1a3 3 0 0 0 0 6h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <svg th:case="'map'" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5 9 4l6 2 5-2v13.5L15 20l-6-2-5 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    <svg th:case="'trophy'" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v3a4 4 0 0 1-8 0V4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 5H4a3 3 0 0 0 3 5M17 5h3a3 3 0 0 1-3 5M12 11v4M9 20h6M10 15h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <svg th:case="'report'" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 3v5h5M10 12h6M10 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <svg th:case="'bell'" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.2-1.8A5 5 0 0 1 16 12.4V10a4 4 0 1 0-8 0v2.4c0 1-.3 2-.8 2.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <svg th:case="'medal'" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 3h6l-1 5h-4zM10.5 18l-1.5 3 3-1 3 1-1.5-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                    <svg th:case="'settings'" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3.8a7 7 0 0 0-1.7-1L14.5 3h-5L9 5.8a7 7 0 0 0-1.7 1L5 6 3 9.5 5 11a7 7 0 0 0 0 2l-2 1.5L5 18l2.3-.8a7 7 0 0 0 1.7 1l.5 2.8h5l.5-2.8a7 7 0 0 0 1.7-1l2.3.8 2-3.5-2-1.5c.1-.3.1-.7.1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                    <svg th:case="'user'" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    <svg th:case="'sparkles'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l1.5 4.5L18 10l-4.5 1.5L12 16l-1.5-4.5L6 10l4.5-1.5zM19 4l.7 2.3L22 7l-2.3.7L19 10l-.7-2.3L16 7l2.3-.7zM5 15l.7 2.3L8 18l-2.3.7L5 21l-.7-2.3L2 18l2.3-.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                    <svg th:case="'checkpoint'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5 6-10a6 6 0 1 0-12 0c0 5 6 10 6 10z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 11.5 11 13l3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span th:text="${item.label}">Item</span>
            </a>
        </nav>
    </div>
    <div class="sidebar-profile">
        <div class="profile-row">
            <div class="profile-avatar" th:text="${rolUi.initials}">CO</div>
            <div class="profile-copy">
                <strong th:text="${rolUi.profileName}">Coordinador</strong>
                <span class="profile-badge" th:text="${rolUi.profileName}">Coordinador</span>
            </div>
        </div>
        <a class="sidebar-logout" th:href="@{/}">Cerrar sesión</a>
    </div>
</aside>
<main class="content">
    <div class="topbar">
        <div>
            <p class="eyebrow">Colegio San José · Supervisión escolar</p>
            <h1 th:text="${title}">Panel</h1>
            <p class="muted role-label" th:text="${rolUi.label}">Vista activa</p>
        </div>
        <a class="ghost-button" th:href="@{/}">Volver al acceso</a>
    </div>
    <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
    <div th:replace="${content}"></div>
</main>
</body>
</html>
