<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Docentes', ~{::section})}"><section class="panel"><div class="table-toolbar"><p class="muted">CRUD de docentes.</p><a class="primary-button" th:href="@{/docentes/nuevo}">Nuevo docente</a></div><table><thead><tr><th>Nombre</th><th>Email</th><th>Materias</th><th>Carga</th><th>Puntaje</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${docentes}"><td th:text="${item.nombre}"></td><td th:text="${item.email}"></td><td th:text="${item.materias}"></td><td th:text="${item.cargaActual}"></td><td th:text="${item.puntajeGamificacion}"></td><td class="table-actions"><a class="secondary-button" th:href="@{/docentes/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/docentes/{id}/eliminar(id=${item.id})}"><button class="danger-button">Eliminar</button></form></td></tr></tbody></table></section></html>
