<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Administradores', ~{::section})}"><section class="panel"><div class="table-toolbar"><p class="muted">CRUD de administradores.</p><a class="primary-button" th:href="@{/administradores/nuevo}">Nuevo administrador</a></div><table><thead><tr><th>Nombre</th><th>Email</th><th>Cargo</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${administradores}"><td th:text="${item.nombre}"></td><td th:text="${item.email}"></td><td th:text="${item.cargo}"></td><td class="table-actions"><a class="secondary-button" th:href="@{/administradores/{id}/editar(id=${item.id})}">Editar</a><form method="post" th:action="@{/administradores/{id}/eliminar(id=${item.id})}"><button class="danger-button">Eliminar</button></form></td></tr></tbody></table></section></html>
