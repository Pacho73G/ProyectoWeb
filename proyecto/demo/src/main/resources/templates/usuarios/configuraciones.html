<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Configuración del sistema', ~{::section})}">
<section class="panel">
    <div class="table-toolbar">
        <p class="muted">Parámetros globales administrados por el sistema.</p>
        <a class="primary-button" th:if="${permisos.allows('configuraciones', 'create')}" th:href="@{/configuraciones/nuevo}">Nueva configuración</a>
    </div>
    <table>
        <thead>
        <tr><th>Administrador</th><th>Alerta ausencia</th><th>Ventana</th><th>Inactividad</th><th th:if="${permisos.showsActions('configuraciones')}">Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${configuraciones}">
            <td th:text="${item.administrador.nombre}"></td>
            <td th:text="${item.minutosAlertaAusencia}"></td>
            <td th:text="${item.segundosVentanaReasignacion}"></td>
            <td th:text="${item.minutosInactividad}"></td>
            <td class="table-actions" th:if="${permisos.showsActions('configuraciones')}">
                <a class="secondary-button" th:if="${permisos.allows('configuraciones', 'edit')}" th:href="@{/configuraciones/{id}/editar(id=${item.id})}">Editar</a>
                <form method="post" th:if="${permisos.allows('configuraciones', 'delete')}" th:action="@{/configuraciones/{id}/eliminar(id=${item.id})}">
                    <button class="danger-button">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</html>
