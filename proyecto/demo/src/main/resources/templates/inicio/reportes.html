<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Reportes', ~{::section})}">
<section>
    <div class="stats-grid">
        <div class="metric-card blue"><strong th:text="${totalTurnos}">0</strong><span>Turnos reportados</span></div>
        <div class="metric-card orange"><strong th:text="${totalIncidentes}">0</strong><span>Incidentes</span></div>
        <div class="metric-card purple"><strong th:text="${totalReasignaciones}">0</strong><span>Reasignaciones</span></div>
        <div class="metric-card green"><strong th:text="${totalRecorridos}">0</strong><span>Recorridos</span></div>
    </div>
    <div class="panel-grid">
        <article class="panel">
            <div class="panel-title-row"><h3>Resumen operativo</h3></div>
            <div class="stack-list">
                <div class="item-card"><strong>Cobertura de turnos</strong><span th:text="|${totalTurnos} turnos con seguimiento operativo|"></span></div>
                <div class="item-card"><strong>Atención de incidentes</strong><span th:text="|${totalIncidentes} registros consolidados|"></span></div>
                <div class="item-card"><strong>Movilidad del personal</strong><span th:text="|${totalReasignaciones} reasignaciones tramitadas|"></span></div>
            </div>
        </article>
        <article class="panel">
            <div class="panel-title-row"><h3>Accesos rápidos</h3></div>
            <div class="quick-actions">
                <a class="action-chip" th:href="@{/turnos}">Ver turnos</a>
                <a class="action-chip" th:href="@{/incidentes}">Ver incidentes</a>
                <a class="action-chip" th:href="@{/reasignaciones}">Ver reasignaciones</a>
                <a class="action-chip" th:href="@{/mapas-calor}">Ver mapas de calor</a>
                <a class="action-chip" th:href="@{/metricas}">Ver métricas</a>
            </div>
        </article>
    </div>
</section>
</html>
