<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(${titulo}, ~{::section})}">
<section class="form-card">
    <form class="form-grid" method="post" th:action="@{${accion}}" th:object="${form}">
        <div class="field">
            <label>Docente</label>
            <select th:field="*{docenteId}" required>
                <option value="">Selecciona un docente</option>
                <option th:each="item : ${docentes}" th:value="${item.id}" th:text="${item.nombre}"></option>
            </select>
        </div>
        <div class="field">
            <label>Zona</label>
            <select th:field="*{zonaId}" required>
                <option value="">Selecciona una zona</option>
                <option th:each="item : ${zonas}" th:value="${item.id}" th:text="${item.nombre}"></option>
            </select>
        </div>
        <div class="field">
            <label>Fecha</label>
            <input type="date" th:field="*{fecha}" required>
        </div>
        <div class="field">
            <label>Franja o nombre del turno</label>
            <input th:field="*{franja}" placeholder="Ej. Recreo mañana, Almuerzo bachillerato, Salida estudiantil" required>
            <small class="muted">Puedes crear todas las franjas que necesites para la operación del colegio.</small>
        </div>
        <div class="field">
            <label>Hora inicio</label>
            <input type="time" th:field="*{horaInicio}" required>
        </div>
        <div class="field">
            <label>Hora fin</label>
            <input type="time" th:field="*{horaFin}" required>
        </div>
        <div class="field">
            <label>Estado</label>
            <select th:field="*{estado}" required>
                <option value="">Selecciona un estado</option>
                <option th:each="item : ${estadosTurno}" th:value="${item}" th:text="${item}"></option>
            </select>
        </div>
        <div class="field">
            <label>Abierto en</label>
            <input type="datetime-local" th:field="*{abiertoEn}">
        </div>
        <div class="field">
            <label>Cerrado en</label>
            <input type="datetime-local" th:field="*{cerradoEn}">
        </div>
        <div class="form-actions full">
            <a class="secondary-button" th:href="@{/turnos}">Cancelar</a>
            <button class="primary-button">Guardar</button>
        </div>
    </form>
</section>
</html>
