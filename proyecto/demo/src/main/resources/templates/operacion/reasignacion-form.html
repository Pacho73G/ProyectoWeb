<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(${titulo}, ~{::section})}"><section class="form-card"><form class="form-grid" method="post" th:action="@{${accion}}" th:object="${form}"><div class="field"><label>Turno</label><select th:field="*{turnoId}" required><option value="">Selecciona un turno</option><option th:each="item : ${turnos}" th:value="${item.id}" th:text="${item.franja}"></option></select></div><div class="field"><label>Docente solicitante</label><select th:field="*{docenteSolicitanteId}" required><option value="">Selecciona un docente</option><option th:each="item : ${docentes}" th:value="${item.id}" th:text="${item.nombre}"></option></select></div><div class="field"><label>Docente reemplazo</label><select th:field="*{docenteReemplazoId}"><option value="">Pendiente</option><option th:each="item : ${docentes}" th:value="${item.id}" th:text="${item.nombre}"></option></select></div><div class="field"><label>Estado</label><select th:field="*{estado}" required><option value="">Selecciona un estado</option><option th:each="item : ${estadosReasignacion}" th:value="${item}" th:text="${item}"></option></select></div><div class="field"><label>Propuesta en</label><input type="datetime-local" th:field="*{propuestaEn}" required></div><div class="field"><label>Respondida en</label><input type="datetime-local" th:field="*{respondidaEn}"></div><div class="field"><label>Segundos ventana</label><input type="number" th:field="*{segundosVentana}" min="0" required></div><div class="field full"><label>Motivo</label><textarea th:field="*{motivo}"></textarea></div><div class="form-actions full"><a class="secondary-button" th:href="@{/reasignaciones}">Cancelar</a><button class="primary-button">Guardar</button></div></form></section></html>
