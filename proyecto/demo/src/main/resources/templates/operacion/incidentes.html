<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Incidentes', ~{::section})}">
<section class="panel">
    <div class="panel-intro">
        <h3 th:text="${rolActivo == 'docente' ? 'Registro rápido de incidentes' : 'Historial operativo de incidentes'}">Incidentes</h3>
        <p th:text="${rolActivo == 'docente' ? 'Documenta lo ocurrido con severidad, zona y contexto en una sola vista.' : 'Consulta eventos reportados y detecta zonas o situaciones que requieren seguimiento.'}">Panel de incidentes.</p>
    </div>
    <div class="table-toolbar">
        <p class="muted" th:text="${rolActivo == 'docente' ? 'Registro ágil de situaciones durante el turno.' : 'Historial de incidentes reportados.'}">Incidentes</p>
        <a class="primary-button" th:if="${permisos.allows('incidentes', 'create')}" th:href="@{/incidentes/nuevo}">Nuevo incidente</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Tipo</th>
            <th>Severidad</th>
            <th>Docente</th>
            <th>Zona</th>
            <th th:if="${permisos.showsActions('incidentes')}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${incidentes}">
            <td>
                <div class="table-main">
                    <strong th:text="${item.tipo}"></strong>
                    <small th:text="${#strings.abbreviate(item.descripcion, 52)}"></small>
                </div>
            </td>
            <td>
                <span class="badge"
                      th:classappend="${item.severidad.name() == 'S3_ATENCION_INMEDIATA' ? ' danger' : (item.severidad.name() == 'S2_SEGUIMIENTO' ? ' warning' : ' info')}"
                      th:text="${item.severidad}"></span>
            </td>
            <td>
                <div class="table-main">
                    <strong th:text="${item.docente.nombre}"></strong>
                    <small th:text="${#temporals.format(item.registradoEn, 'dd/MM/yyyy HH:mm')}"></small>
                </div>
            </td>
            <td>
                <div class="table-main">
                    <strong th:text="${item.zona.nombre}"></strong>
                    <small th:text="${item.requiereSeguimiento ? 'Requiere seguimiento' : 'Sin seguimiento'}"></small>
                </div>
            </td>
            <td class="table-actions" th:if="${permisos.showsActions('incidentes')}">
                <a class="secondary-button" th:if="${permisos.allows('incidentes', 'edit')}" th:href="@{/incidentes/{id}/editar(id=${item.id})}">Editar</a>
                <form method="post" th:if="${permisos.allows('incidentes', 'delete')}" th:action="@{/incidentes/{id}/eliminar(id=${item.id})}">
                    <button class="danger-button">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</html>
