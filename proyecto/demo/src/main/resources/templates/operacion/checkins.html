<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell('Check-ins', ~{::section})}">
<section class="panel">
    <div class="table-toolbar">
        <p class="muted">Validación del ingreso por turno mediante QR, PIN o NFC.</p>
        <a class="primary-button" th:if="${permisos.allows('checkins', 'create')}" th:href="@{/checkins/nuevo}">Nuevo check-in</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Turno</th>
            <th>Docente</th>
            <th>Método</th>
            <th>Válido</th>
            <th th:if="${permisos.showsActions('checkins')}">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${checkins}">
            <td th:text="${item.turno.franja}"></td>
            <td th:text="${item.docente.nombre}"></td>
            <td th:text="${item.metodo}"></td>
            <td th:text="${item.valido}"></td>
            <td class="table-actions" th:if="${permisos.showsActions('checkins')}">
                <a class="secondary-button" th:if="${permisos.allows('checkins', 'edit')}" th:href="@{/checkins/{id}/editar(id=${item.id})}">Editar</a>
                <form method="post" th:if="${permisos.allows('checkins', 'delete')}" th:action="@{/checkins/{id}/eliminar(id=${item.id})}">
                    <button class="danger-button">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</html>
