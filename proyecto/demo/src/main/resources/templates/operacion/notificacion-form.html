<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(${titulo}, ~{::section})}"><section class="form-card"><form class="form-grid" method="post" th:action="@{${accion}}" th:object="${form}"><div class="field full"><label>Turno</label><select th:field="*{turnoId}" required><option value="">Selecciona un turno</option><option th:each="item : ${turnos}" th:value="${item.id}" th:text="${item.franja}"></option></select></div><div class="field"><label>Tipo</label><select th:field="*{tipo}" required><option value="">Selecciona un tipo</option><option th:each="item : ${tiposNotificacion}" th:value="${item}" th:text="${item}"></option></select></div><div class="field"><label>Enviada en</label><input type="datetime-local" th:field="*{enviadaEn}" required></div><div class="field"><label>Minutos anticipación</label><input type="number" th:field="*{minutosAnticipacion}" min="0" required></div><div class="field full"><label>Mensaje</label><textarea th:field="*{mensaje}"></textarea></div><label class="checkbox"><input type="checkbox" th:field="*{leida}">Leída</label><div class="form-actions full"><a class="secondary-button" th:href="@{/notificaciones}">Cancelar</a><button class="primary-button">Guardar</button></div></form></section></html>
